:root{font-family:system-ui,-apple-system,sans-serif;color:#eee9fa;background:#12101c}*{box-sizing:border-box}body{margin:0}header{padding:18px 20px;background:#211a32;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:0}h2{font-size:19px}small,.muted{color:#b5a8cc}main{max-width:850px;margin:auto;padding:18px 16px 90px}.tabs{display:flex;overflow-x:auto;gap:7px;padding:12px 14px;background:#171325;position:sticky;top:65px;z-index:1}.tabs button{white-space:nowrap}button,input,textarea,select{font:inherit}button{background:#44315f;color:white;border:1px solid #6c528e;border-radius:12px;padding:10px 13px;cursor:pointer}button.primary{background:#9d75d0;color:#160e25;font-weight:700}button.danger{background:#4e2539}button.active{background:#9d75d0;color:#160e25}input,textarea,select{width:100%;padding:11px;border:1px solid #665579;border-radius:10px;background:#211a32;color:#fff;margin:5px 0 13px}textarea{min-height:80px;resize:vertical}label{display:block;font-size:13px;color:#d4c5e8;margin-top:8px}.card{background:#211a32;border:1px solid #3c304f;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1}.hidden{display:none!important}.pill{border-radius:30px;background:#382849;padding:5px 9px;font-size:12px}.message{border-radius:15px;padding:12px;margin:10px 0;white-space:pre-wrap;line-height:1.5}.message.user{background:#43315e;margin-left:15%}.message.assistant{background:#282238;margin-right:10%}.message .by{font-size:12px;color:#ceb7ee;margin-bottom:6px}.chatlog{min-height:220px;max-height:52vh;overflow-y:auto;padding:4px}.hint{font-size:13px;color:#c4b5d6;line-height:1.5}.check{display:flex;align-items:center;gap:8px}.check input{width:auto;margin:0}.empty{padding:28px 12px;text-align:center;color:#b5a8cc}.spaced{justify-content:space-between}@media(min-width:700px){.tabs{justify-content:center}}

details{border:1px solid #514064;border-radius:12px;margin:9px 0;padding:11px;background:#1b1628}summary{cursor:pointer;font-weight:650;color:#e6d7f7}details .fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px;margin-top:12px}.avatar{width:44px;height:44px;object-fit:cover;border-radius:50%;border:1px solid #7c6498}.characterhead{display:flex;align-items:center;gap:12px}.novel .chatlog{max-height:65vh;background:#1c1727;border-radius:14px;padding:20px 24px}.novel .message{margin:0;padding:0 0 17px;border-radius:0;background:transparent!important;max-width:none;white-space:pre-wrap;line-height:1.85;font-family:Georgia,serif;font-size:17px}.novel .message .by{font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:10px}.novel .message.user{border-left:2px solid #9472c5;padding-left:14px}.chat .message{max-width:85%}.modepreview{display:flex;gap:8px;align-items:center}.modepreview button{font-size:13px}.subtle{font-size:12px;color:#c4b5d6}button:disabled{opacity:.5;cursor:not-allowed}input[type=range]{padding:0} @media(max-width:550px){.novel .chatlog{padding:15px}.novel .message{font-size:15px}}

body[data-theme="lavender"]{--accent:#b48ad8;--panel:#302440;--page:#21192c}body[data-theme="rose"]{--accent:#e39abb;--panel:#352334;--page:#241923}
.msgtools{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.msgtools button{padding:5px 8px;font-size:12px}.memoryentry{border:1px solid #554367;padding:12px;border-radius:12px;margin:8px 0}.memoryentry p{white-space:pre-wrap}.message .content{white-space:pre-wrap}.warning{border-left:3px solid #e0ad68;padding:9px 12px;background:#3c2e30}.mini{font-size:12px}input[type=checkbox]{width:auto} 
</style></head><body><header><div><h1>✦ Reverie</h1><small>Tu estudio de historias</small></div><span class="pill">v0.3</span></header><nav class="tabs" id="tabs"></nav><main id="app"></main><script>
const KEY='reverie-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};state=state&&Array.isArray(state.characters)&&Array.isArray(state.worlds)&&Array.isArray(state.chats)?state:{characters:[],worlds:[],chats:[],settings:{model:'',apiKey:''}};state.settings={readingMode:'chat',narrativeLength:'medium',perspective:'third',theme:'midnight',initiative:65,creativity:70,...state.settings};document.body.dataset.theme=state.settings.theme||'midnight';let tab='characters',editing=null,activeChat=null;const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),opt=(items,selected)=>items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join(''),get=(arr,id)=>arr.find(x=>x.id===id),download=(name,text,type='text/plain')=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},notice=s=>alert(s);
const nav=[['characters','Personajes'],['worlds','Universos'],['chats','Chats'],['export','Exportar'],['settings','Ajustes']];function render(){ $('#tabs').innerHTML=nav.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('#app').innerHTML=({characters:renderCharacters,worlds:renderWorlds,chats:renderChats,export:renderExport,settings:renderSettings}[tab])() }function go(t){tab=t;editing=null;render()}
const extraSections=[['Identidad y apariencia',[['aliases','Apodos'],['age','Edad'],['pronouns','Pronombres'],['appearance','Apariencia'],['abilities','Habilidades']]],['Personalidad profunda',[['strengths','Virtudes'],['flaws','Defectos'],['fears','Miedos'],['motivations','Motivaciones'],['habits','Hábitos y manías']]],['Historia y Character Bible',[['secrets','Secretos'],['timeline','Cronología y acontecimientos']]],['Relaciones',[['relationships','Familia, amistades, rivalidades y vínculos']]],['Estilo de roleplay',[['examples','Ejemplos de diálogo'],['initiative','Iniciativa y comportamiento']]],['Reglas especiales',[['specialRules','Instrucciones y límites del personaje']]]];
function renderCharacters(){let e=editing&&get(state.characters,editing);return `<div class="row spaced"><h2>Biblioteca de personajes</h2><button onclick="editing='new';render()">+ Personaje</button></div>${editing?`<div class="card"><h2>${e?'Editar':'Nuevo'} personaje · Character Studio</h2><form id="characterForm"><label>Nombre</label><input name="name" required value="${esc(e?.name)}"><label>Descripción breve / personalidad</label><textarea name="personality">${esc(e?.personality)}</textarea><label>Historia / Character Bible</label><textarea name="bio">${esc(e?.bio)}</textarea><label>Estilo de diálogo</label><textarea name="style">${esc(e?.style)}</textarea><label>URL de avatar (opcional, imagen pública)</label><input name="avatar" type="url" placeholder="https://..." value="${esc(e?.avatar)}">${extraSections.map(([title,fields])=>`<details><summary>${title}</summary><div class="fieldgrid">${fields.map(([key,label])=>`<div><label>${label}</label><textarea name="${key}">${esc(e?.[key])}</textarea></div>`).join('')}</div></details>`).join('')}<div class="row"><button class="primary">Guardar personaje</button><button type="button" onclick="editing=null;render()">Cancelar</button></div></form></div>`:''}${state.characters.length?state.characters.map(c=>`<div class="card"><div class="row spaced"><div class="characterhead">${c.avatar?`<img class="avatar" src="${esc(c.avatar)}" alt="">`:''}<b>${esc(c.name)}</b></div><span class="pill">Character Bible</span></div><p class="hint">${esc((c.personality||c.bio||'Sin descripción').slice(0,180))}</p><div class="row"><button onclick="editing='${c.id}';render()">Editar</button><button onclick="duplicateCharacter('${c.id}')">Duplicar / AU</button><button class="danger" onclick="removeItem('characters','${c.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">Crea tu primer personaje para empezar ✨</div>'}`}
function renderWorlds(){let e=editing&&get(state.worlds,editing);return `<div class="row spaced"><h2>Universos</h2><button onclick="editing='new';render()">+ Universo</button></div>${editing?`<div class="card"><form id="worldForm"><label>Nombre del universo</label><input name="name" required value="${esc(e?.name)}"><label>Contexto y ambientación</label><textarea name="description">${esc(e?.description)}</textarea><label>Reglas del mundo</label><textarea name="rules">${esc(e?.rules)}</textarea><div class="row"><button class="primary">Guardar</button><button type="button" onclick="editing=null;render()">Cancelar</button></div></form></div>`:''}${state.worlds.length?state.worlds.map(w=>`<div class="card"><b>${esc(w.name)}</b><p class="hint">${esc(w.description)}</p><button onclick="editing='${w.id}';render()">Editar</button> <button class="danger" onclick="removeItem('worlds','${w.id}')">Eliminar</button></div>`).join(''):'<div class="empty">Crea un universo: MCU, AU, o una historia original.</div>'}`}
function normalizeChat(c){c.messages=(c.messages||[]).map(m=>{if(!m.id)m.id=uid();if(m.role==='assistant'){if(!Array.isArray(m.variants)||!m.variants.length)m.variants=[{content:m.content||'',speaker:m.speaker||'Narrador'}];if(!Number.isInteger(m.selected)||m.selected<0||m.selected>=m.variants.length)m.selected=0;m.content=m.variants[m.selected].content;m.speaker=m.variants[m.selected].speaker}return m});if(!Array.isArray(c.memories))c.memories=[];if(!Array.isArray(c.memorySuggestions))c.memorySuggestions=[];return c}
function messageHtml(m){let assistant=m.role==='assistant',v=assistant?m.variants[m.selected]:null;return `<div class="message ${assistant?'assistant':'user'}"><div class="by">${esc(v?.speaker||m.speaker||(assistant?'Narrador':'Tú'))}</div><div class="content">${esc(v?.content||m.content)}</div><div class="msgtools"><button onclick="editMessage('${m.id}')">✎ Editar</button>${assistant?`<button onclick="selectVariant('${m.id}',-1)" ${m.selected===0?'disabled':''}>‹</button><span class="mini">${m.selected+1}/${m.variants.length}</span><button onclick="selectVariant('${m.id}',1)" ${m.selected===m.variants.length-1?'disabled':''}>›</button><button onclick="regenerate('${m.id}')">↻ Otra respuesta</button>`:''}<button onclick="deleteMessage('${m.id}')">Eliminar</button></div></div>`}
function renderChats(){if(activeChat){let c=get(state.chats,activeChat);if(!c){activeChat=null;return renderChats()}normalizeChat(c);return `<div class="row spaced"><button onclick="activeChat=null;render()">← Chats</button><b>${esc(c.name)}</b></div><div class="card"><div class="hint">Universo: ${esc(get(state.worlds,c.worldId)?.name||'Sin universo')} · Personajes: ${c.characterIds.map(id=>get(state.characters,id)?.name).filter(Boolean).map(esc).join(', ')||'ninguno'}</div><div class="${esc(state.settings.readingMode)}"><div class="chatlog" id="chatlog">${c.messages.map(messageHtml).join('')}</div></div><form id="messageForm"><textarea name="message" placeholder="Escribe tu acción o diálogo..." required></textarea><div class="row"><button class="primary" type="submit">Enviar y generar</button><button type="button" onclick="addManual()">+ Respuesta manual</button></div></form><details><summary>🧠 Memoria narrativa · ${c.memories.length} recuerdos</summary><p class="hint">Los recuerdos aprobados se añaden al contexto de la IA. Las sugerencias requieren tu confirmación.</p><label>Memoria heredada de v0.2</label><textarea id="memory">${esc(c.memory||'')}</textarea><button onclick="saveMemory()">Guardar memoria antigua</button><hr><label>Nuevo recuerdo manual</label><textarea id="newMemory" placeholder="Un hecho importante de la historia..."></textarea><button onclick="addMemory()">+ Fijar recuerdo</button><h3>Recuerdos aprobados</h3>${c.memories.map(x=>`<div class="memoryentry"><p>${esc(x.text)}</p><button onclick="editMemory('${x.id}')">Editar</button> <button onclick="removeMemory('${x.id}')">Eliminar</button></div>`).join('')||'<p class="hint">Aún no hay recuerdos aprobados.</p>'}<h3>Propuestas pendientes (${c.memorySuggestions.length})</h3>${c.memorySuggestions.map(x=>`<div class="memoryentry"><p>${esc(x.text)}</p><button onclick="reviewMemory('${x.id}',true)">✓ Aprobar</button> <button onclick="reviewMemory('${x.id}',false)">Descartar</button></div>`).join('')||'<p class="hint">No hay propuestas pendientes.</p>'}<button onclick="suggestMemories()">✦ Proponer recuerdos con IA</button></details><button onclick="exportChat('${c.id}')">Exportar historia (.txt)</button></div>`}return `<div class="row spaced"><h2>Historias y chats</h2><button onclick="editing='new';render()">+ Chat</button></div>${editing?`<div class="card"><form id="chatForm"><label>Título</label><input name="name" required placeholder="Una nueva historia"><label>Universo</label><select name="worldId"><option value="">Sin universo</option>${opt(state.worlds,'')}</select><label>Personajes (puedes elegir varios)</label>${state.characters.map(c=>`<label class="check"><input type="checkbox" name="characterIds" value="${c.id}">${esc(c.name)}</label>`).join('')||'<p class="hint">Crea personajes primero.</p>'}<label>Premisa inicial</label><textarea name="premise" placeholder="Dónde empieza la historia..."></textarea><div class="row"><button class="primary">Crear chat</button><button type="button" onclick="editing=null;render()">Cancelar</button></div></form></div>`:''}${state.chats.map(c=>`<div class="card"><b>${esc(c.name)}</b><p class="hint">${c.messages.length} mensajes · ${c.characterIds.length} personajes</p><button onclick="activeChat='${c.id}';render()">Abrir</button> <button class="danger" onclick="removeItem('chats','${c.id}')">Eliminar</button></div>`).join('')||'<div class="empty">Crea un chat para comenzar tu historia.</div>'}`}
function currentChat(){let c=get(state.chats,activeChat);return c&&normalizeChat(c)}
function duplicateCharacter(id){let c=get(state.characters,id);if(!c)return;let name=prompt('Nombre de esta versión alternativa:',c.name+' — AU');if(!name?.trim())return;state.characters.push({...c,id:uid(),name:name.trim()});save();render()}
function selectVariant(id,delta){let c=currentChat(),m=c?.messages.find(x=>x.id===id);if(!m||m.role!=='assistant')return;let i=m.selected+delta;if(i<0||i>=m.variants.length)return;m.selected=i;m.content=m.variants[i].content;m.speaker=m.variants[i].speaker;save();render()}
function editMessage(id){let c=currentChat(),m=c?.messages.find(x=>x.id===id);if(!m)return;let original=m.role==='assistant'?m.variants[m.selected].content:m.content;let text=prompt('Editar mensaje:',original);if(text===null||!text.trim())return;if(m.role==='assistant')m.variants[m.selected].content=text; m.content=text;save();render();notice('Mensaje editado. Si hay respuestas posteriores, revisa su continuidad.')}
function deleteMessage(id){let c=currentChat();if(!c||!confirm('¿Eliminar este mensaje?'))return;c.messages=c.messages.filter(x=>x.id!==id);save();render()}
function addMemory(){let c=currentChat(),v=$('#newMemory')?.value.trim();if(!v)return notice('Escribe un recuerdo');c.memories.push({id:uid(),text:v});save();render()}
function editMemory(id){let c=currentChat(),m=c?.memories.find(x=>x.id===id);if(!m)return;let v=prompt('Editar recuerdo:',m.text);if(v===null)return;m.text=v.trim();if(!m.text)c.memories=c.memories.filter(x=>x.id!==id);save();render()}
function removeMemory(id){let c=currentChat();if(!c||!confirm('¿Eliminar este recuerdo?'))return;c.memories=c.memories.filter(x=>x.id!==id);save();render()}
function reviewMemory(id,approve){let c=currentChat(),m=c?.memorySuggestions.find(x=>x.id===id);if(!m)return;if(approve)c.memories.push({id:uid(),text:m.text});c.memorySuggestions=c.memorySuggestions.filter(x=>x.id!==id);save();render()}
function renderExport(){return `<h2>Exportación y respaldo</h2><div class="card"><p>Descarga personajes, universos, chats y memorias como archivo JSON. Puedes importarlo después en este u otro dispositivo.</p><button class="primary" onclick="download('reverie-backup.json',JSON.stringify({...state,settings:{...state.settings,apiKey:''}},null,2),'application/json')">Descargar respaldo JSON</button><p class="hint">La clave API nunca se incluye en el respaldo.</p><label>Restaurar un respaldo JSON</label><input id="importFile" type="file" accept="application/json,.json"><button onclick="importBackup()">Importar respaldo</button></div><div class="card"><h2>Exportar historias</h2>${state.chats.map(c=>`<p><button onclick="exportChat('${c.id}')">${esc(c.name)} (.txt)</button></p>`).join('')||'<p class="hint">Todavía no hay historias.</p>'}</div>`}
function renderSettings(){return `<h2>Ajustes de Reverie</h2><div class="card"><h2>Modo de lectura</h2><p class="hint">Cambia la presentación sin modificar tus mensajes.</p><div class="row"><button class="${state.settings.readingMode==='chat'?'active':''}" onclick="setReadingMode('chat')">💬 Chat</button><button class="${state.settings.readingMode==='novel'?'active':''}" onclick="setReadingMode('novel')">📖 Novela</button></div></div><div class="card"><h2>Narración</h2><form id="narrativeForm"><label>Longitud de respuestas</label><select name="narrativeLength"><option value="short" ${state.settings.narrativeLength==='short'?'selected':''}>Corta</option><option value="medium" ${state.settings.narrativeLength==='medium'?'selected':''}>Media</option><option value="long" ${state.settings.narrativeLength==='long'?'selected':''}>Larga</option></select><label>Perspectiva narrativa</label><select name="perspective"><option value="third" ${state.settings.perspective==='third'?'selected':''}>Tercera persona</option><option value="first" ${state.settings.perspective==='first'?'selected':''}>Primera persona (personajes de IA)</option></select><button class="primary">Guardar preferencias narrativas</button></form><p class="hint">La IA recibe estas preferencias en futuras generaciones; los mensajes anteriores no cambian.</p></div><div class="card"><h2>Control narrativo</h2><form id="advancedForm"><label>Iniciativa de personajes (0–100)</label><input type="range" name="initiative" min="0" max="100" value="${esc(state.settings.initiative)}"><label>Creatividad (0–100)</label><input type="range" name="creativity" min="0" max="100" value="${esc(state.settings.creativity)}"><label>Tema visual</label><select name="theme"><option value="midnight" ${state.settings.theme==='midnight'?'selected':''}>Midnight</option><option value="lavender" ${state.settings.theme==='lavender'?'selected':''}>Lavender</option><option value="rose" ${state.settings.theme==='rose'?'selected':''}>Rose</option></select><button class="primary">Guardar controles</button></form></div><div class="card"><h2>Modelo de IA</h2><p class="hint">Conexión directa con OpenRouter. La clave se almacena en este navegador; no la subas a GitHub. Para una app compartida recomendamos un servidor intermediario seguro.</p><form id="settingsForm"><label>ID exacto del modelo OpenRouter</label><input name="model" placeholder="openrouter/free" value="${esc(state.settings.model)}"><label>Clave API</label><input type="password" name="apiKey" autocomplete="off" placeholder="sk-or-..." value="${esc(state.settings.apiKey)}"><button class="primary">Guardar conexión</button></form><p class="hint">La clave API no se incluye en respaldos JSON.</p></div>`}
function setReadingMode(mode){state.settings.readingMode=mode;save();render()}
function removeItem(type,id){if(!confirm('¿Eliminar este elemento?'))return;state[type]=state[type].filter(x=>x.id!==id);save();render()}
function saveMemory(){get(state.chats,activeChat).memory=$('#memory').value;save();notice('Memoria guardada')}
function exportChat(id){let c=get(state.chats,id);download((c.name.replace(/[^a-z0-9áéíóúñ_-]/gi,'_')||'historia')+'.txt',`${c.name}\n\nMEMORIA:\n${c.memory||''}\n${(c.memories||[]).map(x=>'- '+x.text).join('\n')}\n\n`+c.messages.map(m=>`${m.speaker||m.role}:\n${m.content}`).join('\n\n'))}
async function importBackup(){let file=$('#importFile').files[0];if(!file)return notice('Selecciona un archivo');try{let v=JSON.parse(await file.text());if(!Array.isArray(v.characters)||!Array.isArray(v.worlds)||!Array.isArray(v.chats))throw Error('Formato incorrecto');if(!confirm('¿Reemplazar todos los datos locales con este respaldo?'))return;state={characters:v.characters,worlds:v.worlds,chats:v.chats,settings:{readingMode:'chat',narrativeLength:'medium',perspective:'third',theme:'midnight',initiative:65,creativity:70,...v.settings,apiKey:''}};save();activeChat=null;document.body.dataset.theme=state.settings.theme||'midnight';render();notice('Respaldo importado')}catch(e){notice('No se pudo importar: '+e.message)}}
function addManual(){let c=get(state.chats,activeChat),speaker=prompt('Nombre del personaje o narrador:','Narrador');if(speaker===null)return;let content=prompt('Respuesta del personaje:');if(!content)return;c.messages.push({id:uid(),role:'assistant',speaker,content,selected:0,variants:[{speaker,content}]});save();render();scrollChat()}
function scrollChat(){let e=$('#chatlog');if(e)e.scrollTop=e.scrollHeight}
function promptFor(c){let w=get(state.worlds,c.worldId),chars=c.characterIds.map(id=>get(state.characters,id)).filter(Boolean);return `Eres un motor de roleplay narrativo colaborativo. Responde en español, con prosa inmersiva, diálogos naturales y continuidad. NUNCA escribas acciones, pensamientos ni diálogos del personaje del usuario; conserva su agencia. No confundas personajes ni universos. En chats grupales indica claramente quién habla. No afirmes recordar hechos que no estén en el contexto.\nUNIVERSO: ${w?.name||'Libre'}\nAMBIENTACIÓN: ${w?.description||''}\nREGLAS DEL UNIVERSO: ${w?.rules||''}\nPERSONAJES:\n${chars.map(x=>`Nombre: ${x.name}\nPersonalidad: ${x.personality}\nBiografía: ${x.bio}\nEstilo: ${x.style}\n${extraSections.flatMap(([,fields])=>fields).map(([key,label])=>x[key]?`${label}: ${x[key]}`:'').filter(Boolean).join('\n')}\nReglas específicas: ${x.specialRules||''}`).join('\n---\n')}\nPREMISA: ${c.premise||''}\nMEMORIA: ${c.memory||''}\nRECUERDOS APROBADOS: ${(c.memories||[]).map(x=>x.text).join(' | ')||'Ninguno'}\nINICIATIVA DE LOS PERSONAJES: ${state.settings.initiative||65}/100. Pueden impulsar la escena sin controlar al usuario.\nCREATIVIDAD: ${state.settings.creativity||70}/100.\nPREFERENCIA DE LONGITUD: ${state.settings.narrativeLength==='long'?'Respuestas largas y detalladas':state.settings.narrativeLength==='short'?'Respuestas breves':'Respuestas de extensión media'}\nPERSPECTIVA: ${state.settings.perspective==='first'?'Primera persona desde el personaje de IA':'Tercera persona narrativa'}`}
async function callAI(messages,temperature){let {model,apiKey}=state.settings;if(!model||!apiKey)throw Error('Configura modelo y clave en Ajustes');let res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+apiKey,'X-Title':'Reverie Roleplay'},body:JSON.stringify({model,messages,temperature})});let data=await res.json();if(!res.ok)throw Error(data.error?.message||`HTTP ${res.status}`);let answer=data.choices?.[0]?.message?.content;if(typeof answer!=='string'||!answer.trim())throw Error('Respuesta vacía');return answer.trim()}
function aiMessages(c,beforeIndex=c.messages.length){normalizeChat(c);return [{role:'system',content:promptFor(c)},...c.messages.slice(Math.max(0,beforeIndex-24),beforeIndex).map(m=>({role:m.role==='user'?'user':'assistant',content:(m.speaker?m.speaker+': ':'')+m.content}))]}
async function generate(c){if(!state.settings.model||!state.settings.apiKey)return notice('Mensaje guardado. Configura el modelo y la clave en Ajustes.');let b=$('#messageForm button[type=submit]');if(b){b.disabled=true;b.textContent='Generando...'}try{let answer=await callAI(aiMessages(c),Math.min(1.5,0.3+(state.settings.creativity||70)/100));c.messages.push({id:uid(),role:'assistant',speaker:'Narrador / personajes',content:answer,selected:0,variants:[{speaker:'Narrador / personajes',content:answer}]});save();render();scrollChat()}catch(e){notice('No se pudo generar. Tu mensaje sí se guardó. Detalle: '+e.message)}finally{let b=$('#messageForm button[type=submit]');if(b){b.disabled=false;b.textContent='Enviar y generar'}}}
async function regenerate(id){let c=currentChat(),i=c?.messages.findIndex(m=>m.id===id);if(i<0)return;if(i<c.messages.length-1&&!confirm('Hay mensajes posteriores. La nueva variante podría contradecirlos. ¿Continuar?'))return;try{let m=c.messages[i],answer=await callAI(aiMessages(c,i),Math.min(1.5,0.3+(state.settings.creativity||70)/100));m.variants.push({speaker:m.speaker||'Narrador / personajes',content:answer});m.selected=m.variants.length-1;m.content=answer;save();render()}catch(e){notice('No se pudo regenerar: '+e.message)}}
async function suggestMemories(){let c=currentChat();if(!c)return;if(c.messages.length<2)return notice('Necesitas al menos dos mensajes para proponer recuerdos.');try{let excerpt=c.messages.slice(-30).map(m=>`${m.speaker||m.role}: ${m.content}`).join('\n').slice(-16000);let answer=await callAI([{role:'system',content:'Extrae hasta 4 hechos duraderos y concretos importantes para la continuidad de esta historia. No inventes nada ni repitas información trivial. Devuelve SOLO un arreglo JSON de strings en español. Si no hay hechos relevantes, devuelve [].'},{role:'user',content:excerpt}],0.2);let cleaned=answer.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();let suggestions=JSON.parse(cleaned);if(!Array.isArray(suggestions))throw Error('Formato inesperado');let existing=[...c.memories,...c.memorySuggestions].map(x=>x.text.toLowerCase());for(let x of suggestions.slice(0,4)){if(typeof x==='string'&&x.trim()&&!existing.includes(x.trim().toLowerCase()))c.memorySuggestions.push({id:uid(),text:x.trim()})}save();render();notice('Propuestas listas para revisar. No se guardarán como recuerdos hasta que las apruebes.')}catch(e){notice('No se pudieron proponer recuerdos: '+e.message)}}
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='advancedForm'){state.settings={...state.settings,initiative:Number(d.get('initiative')),creativity:Number(d.get('creativity')),theme:d.get('theme')};document.body.dataset.theme=state.settings.theme;save();render();notice('Controles guardados')}else if(f.id==='characterForm'){let previous=get(state.characters,editing)||{};let v={...previous,id:editing==='new'?uid():editing,name:d.get('name').trim(),personality:d.get('personality'),bio:d.get('bio'),style:d.get('style'),avatar:d.get('avatar')};for(let [,fields] of extraSections)for(let [key] of fields)v[key]=d.get(key)||'';state.characters=state.characters.filter(x=>x.id!==v.id).concat(v);editing=null;save();render()}else if(f.id==='worldForm'){let v={id:editing==='new'?uid():editing,name:d.get('name').trim(),description:d.get('description'),rules:d.get('rules')};state.worlds=state.worlds.filter(x=>x.id!==v.id).concat(v);editing=null;save();render()}else if(f.id==='chatForm'){let c={id:uid(),name:d.get('name').trim(),worldId:d.get('worldId'),characterIds:d.getAll('characterIds'),premise:d.get('premise'),memory:'',memories:[],memorySuggestions:[],messages:[]};state.chats.push(c);editing=null;activeChat=c.id;save();render()}else if(f.id==='narrativeForm'){state.settings={...state.settings,narrativeLength:d.get('narrativeLength'),perspective:d.get('perspective')};save();render();notice('Preferencias guardadas')}else if(f.id==='settingsForm'){state.settings={...state.settings,model:d.get('model').trim(),apiKey:d.get('apiKey').trim()};save();notice('Ajustes guardados')}else if(f.id==='messageForm'){let content=d.get('message').trim();if(!content)return;let c=get(state.chats,activeChat);c.messages.push({id:uid(),role:'user',speaker:'Tú',content});save();render();scrollChat();generate(c)}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
