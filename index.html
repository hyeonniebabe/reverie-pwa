<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171325"><meta name="apple-mobile-web-app-capable" content="yes"><title>Reverie — Roleplay Studio</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eee9fa;background:#12101c}*{box-sizing:border-box}body{margin:0}header{padding:18px 20px;background:#211a32;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:0}h2{font-size:19px}small,.muted{color:#b5a8cc}main{max-width:850px;margin:auto;padding:18px 16px 90px}.tabs{display:flex;overflow-x:auto;gap:7px;padding:12px 14px;background:#171325;position:sticky;top:65px;z-index:1}.tabs button{white-space:nowrap}button,input,textarea,select{font:inherit}button{background:#44315f;color:white;border:1px solid #6c528e;border-radius:12px;padding:10px 13px;cursor:pointer}button.primary{background:#9d75d0;color:#160e25;font-weight:700}button.danger{background:#4e2539}button.active{background:#9d75d0;color:#160e25}input,textarea,select{width:100%;padding:11px;border:1px solid #665579;border-radius:10px;background:#211a32;color:#fff;margin:5px 0 13px}textarea{min-height:80px;resize:vertical}label{display:block;font-size:13px;color:#d4c5e8;margin-top:8px}.card{background:#211a32;border:1px solid #3c304f;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1}.hidden{display:none!important}.pill{border-radius:30px;background:#382849;padding:5px 9px;font-size:12px}.message{border-radius:15px;padding:12px;margin:10px 0;white-space:pre-wrap;line-height:1.5}.message.user{background:#43315e;margin-left:15%}.message.assistant{background:#282238;margin-right:10%}.message .by{font-size:12px;color:#ceb7ee;margin-bottom:6px}.chatlog{min-height:220px;max-height:52vh;overflow-y:auto;padding:4px}.hint{font-size:13px;color:#c4b5d6;line-height:1.5}.check{display:flex;align-items:center;gap:8px}.check input{width:auto;margin:0}.empty{padding:28px 12px;text-align:center;color:#b5a8cc}.spaced{justify-content:space-between}@media(min-width:700px){.tabs{justify-content:center}}
</style></head><body><header><div><h1>✦ Reverie</h1><small>Tu estudio de historias</small></div><span class="pill">v0.1</span></header><nav class="tabs" id="tabs"></nav><main id="app"></main><script>
const KEY='reverie-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};state=state&&Array.isArray(state.characters)&&Array.isArray(state.worlds)&&Array.isArray(state.chats)?state:{characters:[],worlds:[],chats:[],settings:{model:'',apiKey:''}};let tab='characters',editing=null,activeChat=null;const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),opt=(items,selected)=>items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join(''),get=(arr,id)=>arr.find(x=>x.id===id),download=(name,text,type='text/plain')=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},notice=s=>alert(s);
const nav=[['characters','Personajes'],['worlds','Universos'],['chats','Chats'],['export','Exportar'],['settings','Ajustes']];function render(){ $('#tabs').innerHTML=nav.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('#app').innerHTML=({characters:renderCharacters,worlds:renderWorlds,chats:renderChats,export:renderExport,settings:renderSettings}[tab])() }function go(t){tab=t;editing=null;render()}
function renderCharacters(){let e=editing&&get(state.characters,editing);return `<div class="row spaced"><h2>Biblioteca de personajes</h2><button onclick="editing='new';render()">+ Personaje</button></div>${editing?`<div class="card"><h2>${e?'Editar':'Nuevo'} personaje</h2><form id="characterForm"><label>Nombre</label><input name="name" required value="${esc(e?.name)}"><label>Personalidad</label><textarea name="personality">${esc(e?.personality)}</textarea><label>Historia / Character Bible</label><textarea name="bio">${esc(e?.bio)}</textarea><label>Estilo de diálogo</label><textarea name="style">${esc(e?.style)}</textarea><div class="row"><button class="primary">Guardar</button><button type="button" onclick="editing=null;render()">Cancelar</button></div></form></div>`:''}${state.characters.length?state.characters.map(c=>`<div class="card"><div class="row spaced"><b>${esc(c.name)}</b><span class="pill">Character Bible</span></div><p class="hint">${esc((c.personality||c.bio||'Sin descripción').slice(0,180))}</p><div class="row"><button onclick="editing='${c.id}';render()">Editar</button><button class="danger" onclick="removeItem('characters','${c.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">Crea tu primer personaje para empezar ✨</div>'}`}
function renderWorlds(){let e=editing&&get(state.worlds,editing);return `<div class="row spaced"><h2>Universos</h2><button onclick="editing='new';render()">+ Universo</button></div>${editing?`<div class="card"><form id="worldForm"><label>Nombre del universo</label><input name="name" required value="${esc(e?.name)}"><label>Contexto y ambientación</label><textarea name="description">${esc(e?.description)}</textarea><label>Reglas del mundo</label><textarea name="rules">${esc(e?.rules)}</textarea><div class="row"><button class="primary">Guardar</button><button type="button" onclick="editing=null;render()">Cancelar</button></div></form></div>`:''}${state.worlds.length?state.worlds.map(w=>`<div class="card"><b>${esc(w.name)}</b><p class="hint">${esc(w.description)}</p><button onclick="editing='${w.id}';render()">Editar</button> <button class="danger" onclick="removeItem('worlds','${w.id}')">Eliminar</button></div>`).join(''):'<div class="empty">Crea un universo: MCU, AU, o una historia original.</div>'}`}
function renderChats(){if(activeChat){let c=get(state.chats,activeChat);if(!c){activeChat=null;return renderChats()}return `<div class="row spaced"><button onclick="activeChat=null;render()">← Chats</button><b>${esc(c.name)}</b></div><div class="card"><div class="hint">Universo: ${esc(get(state.worlds,c.worldId)?.name||'Sin universo')} · Personajes: ${c.characterIds.map(id=>get(state.characters,id)?.name).filter(Boolean).join(', ')||'ninguno'}</div><div class="chatlog" id="chatlog">${c.messages.map(m=>`<div class="message ${m.role==='user'?'user':'assistant'}"><div class="by">${esc(m.speaker|| (m.role==='user'?'Tú':'Narrador'))}</div>${esc(m.content)}</div>`).join('')}</div><form id="messageForm"><textarea name="message" placeholder="Escribe tu acción o diálogo..." required></textarea><div class="row"><button class="primary" type="submit">Enviar y generar</button><button type="button" onclick="addManual()">Añadir respuesta manual</button></div></form><p class="hint">La generación automática requiere un modelo gratuito disponible y una conexión configurada. Las respuestas manuales sirven para probar escenas sin IA.</p></div><div class="card"><h2>Memoria narrativa</h2><p class="hint">Escribe hechos que el modelo debe recordar. Se incluyen al generar respuestas.</p><textarea id="memory">${esc(c.memory)}</textarea><button onclick="saveMemory()">Guardar memoria</button></div><button onclick="exportChat('${c.id}')">Exportar historia (.txt)</button>`}return `<div class="row spaced"><h2>Historias y chats</h2><button onclick="editing='new';render()">+ Chat</button></div>${editing?`<div class="card"><form id="chatForm"><label>Título</label><input name="name" required placeholder="Una nueva historia"><label>Universo</label><select name="worldId"><option value="">Sin universo</option>${opt(state.worlds,'')}</select><label>Personajes (puedes elegir varios)</label>${state.characters.map(c=>`<label class="check"><input type="checkbox" name="characterIds" value="${c.id}">${esc(c.name)}</label>`).join('')||'<p class="hint">Crea personajes primero.</p>'}<label>Premisa inicial</label><textarea name="premise" placeholder="Dónde empieza la historia..."></textarea><div class="row"><button class="primary">Crear chat</button><button type="button" onclick="editing=null;render()">Cancelar</button></div></form></div>`:''}${state.chats.map(c=>`<div class="card"><b>${esc(c.name)}</b><p class="hint">${c.messages.length} mensajes · ${c.characterIds.length} personajes</p><button onclick="activeChat='${c.id}';render()">Abrir</button> <button class="danger" onclick="removeItem('chats','${c.id}')">Eliminar</button></div>`).join('')||'<div class="empty">Crea un chat para comenzar tu historia.</div>'}`}
function renderExport(){return `<h2>Exportación y respaldo</h2><div class="card"><p>Descarga personajes, universos, chats y memorias como archivo JSON. Puedes importarlo después en este u otro dispositivo.</p><button class="primary" onclick="download('reverie-backup.json',JSON.stringify({...state,settings:{...state.settings,apiKey:''}},null,2),'application/json')">Descargar respaldo JSON</button><p class="hint">La clave API nunca se incluye en el respaldo.</p><label>Restaurar un respaldo JSON</label><input id="importFile" type="file" accept="application/json,.json"><button onclick="importBackup()">Importar respaldo</button></div><div class="card"><h2>Exportar historias</h2>${state.chats.map(c=>`<p><button onclick="exportChat('${c.id}')">${esc(c.name)} (.txt)</button></p>`).join('')||'<p class="hint">Todavía no hay historias.</p>'}</div>`}
function renderSettings(){return `<h2>Ajustes del modelo</h2><div class="card"><p class="hint">Modo opcional: conexión directa con OpenRouter. La clave se mantiene en el navegador, pero las llamadas directas pueden exponerla al entorno del dispositivo y el proveedor puede limitar las solicitudes desde navegadores. Para una app pública se requiere un backend seguro.</p><form id="settingsForm"><label>ID exacto de modelo gratuito OpenRouter</label><input name="model" placeholder="Ejemplo: proveedor/modelo:free" value="${esc(state.settings.model)}"><label>Clave API de OpenRouter</label><input type="password" name="apiKey" autocomplete="off" placeholder="sk-or-..." value="${esc(state.settings.apiKey)}"><button class="primary">Guardar ajustes</button></form><p class="hint">Nunca compartas tu clave. No se incluye en los respaldos. En esta versión queda almacenada localmente en el navegador.</p></div><div class="card"><h2>Reglas narrativas</h2><p>La IA recibe la Character Bible, el universo, la memoria y los mensajes recientes. Debe respetar la agencia de tu personaje y distinguir voces en chats grupales.</p></div>`}
function removeItem(type,id){if(!confirm('¿Eliminar este elemento?'))return;state[type]=state[type].filter(x=>x.id!==id);save();render()}
function saveMemory(){get(state.chats,activeChat).memory=$('#memory').value;save();notice('Memoria guardada')}
function exportChat(id){let c=get(state.chats,id);download((c.name.replace(/[^a-z0-9áéíóúñ_-]/gi,'_')||'historia')+'.txt',`${c.name}\n\nMEMORIA:\n${c.memory||''}\n\n`+c.messages.map(m=>`${m.speaker||m.role}:\n${m.content}`).join('\n\n'))}
async function importBackup(){let file=$('#importFile').files[0];if(!file)return notice('Selecciona un archivo');try{let v=JSON.parse(await file.text());if(!Array.isArray(v.characters)||!Array.isArray(v.worlds)||!Array.isArray(v.chats))throw Error('Formato incorrecto');if(!confirm('¿Reemplazar todos los datos locales con este respaldo?'))return;state={characters:v.characters,worlds:v.worlds,chats:v.chats,settings:{model:v.settings?.model||'',apiKey:''}};save();activeChat=null;render();notice('Respaldo importado')}catch(e){notice('No se pudo importar: '+e.message)}}
function addManual(){let c=get(state.chats,activeChat),speaker=prompt('Nombre del personaje o narrador:','Narrador');if(speaker===null)return;let content=prompt('Respuesta del personaje:');if(!content)return;c.messages.push({role:'assistant',speaker,content});save();render();scrollChat()}
function scrollChat(){let e=$('#chatlog');if(e)e.scrollTop=e.scrollHeight}
function promptFor(c){let w=get(state.worlds,c.worldId),chars=c.characterIds.map(id=>get(state.characters,id)).filter(Boolean);return `Eres un motor de roleplay narrativo colaborativo. Responde en español, con prosa inmersiva, diálogos naturales y continuidad. NUNCA escribas acciones, pensamientos ni diálogos del personaje del usuario; conserva su agencia. No confundas personajes ni universos. En chats grupales indica claramente quién habla. No afirmes recordar hechos que no estén en el contexto.\nUNIVERSO: ${w?.name||'Libre'}\nAMBIENTACIÓN: ${w?.description||''}\nREGLAS DEL UNIVERSO: ${w?.rules||''}\nPERSONAJES:\n${chars.map(x=>`Nombre: ${x.name}\nPersonalidad: ${x.personality}\nBiografía: ${x.bio}\nEstilo: ${x.style}`).join('\n---\n')}\nPREMISA: ${c.premise||''}\nMEMORIA: ${c.memory||'Sin recuerdos fijados.'}`}
async function generate(c){let {model,apiKey}=state.settings;if(!model||!apiKey)return notice('Mensaje guardado. Para generar con IA, configura un modelo y clave gratuitos en Ajustes. También puedes añadir respuestas manuales.');let b=$('#messageForm button[type=submit]');if(b){b.disabled=true;b.textContent='Generando...'}try{let messages=[{role:'system',content:promptFor(c)},...c.messages.slice(-24).map(m=>({role:m.role==='user'?'user':'assistant',content:(m.speaker?m.speaker+': ':'')+m.content}))];let res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+apiKey,'X-Title':'Reverie Roleplay'},body:JSON.stringify({model,messages,temperature:0.85})});let data=await res.json();if(!res.ok)throw Error(data.error?.message||`HTTP ${res.status}`);let answer=data.choices?.[0]?.message?.content;if(typeof answer!=='string'||!answer.trim())throw Error('Respuesta vacía');c.messages.push({role:'assistant',speaker:'Narrador / personajes',content:answer});save();render();scrollChat()}catch(e){notice('No se pudo generar. Tu mensaje sí se guardó. Detalle: '+e.message)}finally{let b=$('#messageForm button[type=submit]');if(b){b.disabled=false;b.textContent='Enviar y generar'}}}
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='characterForm'){let v={id:editing==='new'?uid():editing,name:d.get('name').trim(),personality:d.get('personality'),bio:d.get('bio'),style:d.get('style')};state.characters=state.characters.filter(x=>x.id!==v.id).concat(v);editing=null;save();render()}else if(f.id==='worldForm'){let v={id:editing==='new'?uid():editing,name:d.get('name').trim(),description:d.get('description'),rules:d.get('rules')};state.worlds=state.worlds.filter(x=>x.id!==v.id).concat(v);editing=null;save();render()}else if(f.id==='chatForm'){let c={id:uid(),name:d.get('name').trim(),worldId:d.get('worldId'),characterIds:d.getAll('characterIds'),premise:d.get('premise'),memory:'',messages:[]};state.chats.push(c);editing=null;activeChat=c.id;save();render()}else if(f.id==='settingsForm'){state.settings={model:d.get('model').trim(),apiKey:d.get('apiKey').trim()};save();notice('Ajustes guardados')}else if(f.id==='messageForm'){let content=d.get('message').trim();if(!content)return;let c=get(state.chats,activeChat);c.messages.push({role:'user',speaker:'Tú',content});save();render();scrollChat();generate(c)}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
